relevant_experience = "Python software engineering experience with debugging silent logic defects (no crashes, no stack traces) across a multi-module pipeline; familiarity with tamper-evident hash chains (Merkle-style, hash(prev || payload)), longest-valid-chain reconciliation of the kind used in append-only replicated logs, finite state machines for lifecycle enforcement, CSV parsing edge cases, and materializing derived results into SQLite."
difficulty_explanation = "The shipped implementation carries twelve independent clusters of silent logical defects across the six ledger modules, and every one of them still lets the pipeline run to completion and emit plausible-looking output. Ten clusters are long-standing: two wrong target states in the STORE/HIT/MISS/EVICT transition table; a break-instead-of-continue on malformed or duplicate-header CSV rows; a chain builder that commits to the first locally-valid candidate at each position instead of searching for the sequence that reaches furthest, with an alphabetical tie-break that wrongly applies among every locally-valid candidate instead of only among branches that reach equally far; the same chain builder trusting a candidate's self-reported chain_hash instead of recomputing it from the row's own fields, so a row whose prev_hash still links correctly but whose payload was tampered with after hashing is admitted anyway; a timestamp check that rejects a candidate whose timestamp repeats the previous one instead of only rejecting one that goes backwards; a payload check that compares content hash but ignores size, paired with a 'most recent STORE' bookkeeping bug that binds to an artifact's first STORE instead of its latest, so the two only cancel out when fixed together; storage that never clears the ledger, artifact_state, or summary tables before rewriting them, so a shorter or different second run against a reused database silently leaves rows from a longer first run behind; the same storage layer writing each row's prev_hash and chain_hash values into each other's columns, so every persisted row's chain-linkage columns are swapped; a summary op-count builder that omits any operation type with zero occurrences instead of reporting it explicitly as zero; and an artifact-state builder that folds recovered rows in fragment-filename order instead of chronological sequence order, so an artifact touched across more than one fragment file can end up with the wrong final state or last_seq. Two clusters are new. A fifth lifecycle operation, REFRESH, is documented as valid from STORED (stays STORED) and from EVICTED (stays EVICTED), payload-bound like HIT and EVICT. Three sub-defects: the EVICTED-to-REFRESH transition entry is missing, so a REFRESH row on an evicted artifact wrongly truncates the chain; REFRESH is left out of the payload-bound op set, so a mismatched-payload REFRESH is silently accepted instead of rejected; and the artifact_state last-seq bookkeeping updates on STORE, HIT, EVICT, and MISS but not REFRESH, so an artifact whose final recovered row is a REFRESH reports a stale last_seq. None of these three are observable against the bundled sample, which never exercises REFRESH. A new summary.json key, distinct_artifacts, counts unique artifact ids among the recovered rows; the shipped implementation sources this count from the raw parsed candidates, including rejected forks and decoys, instead of the recovered list threaded out of build_chain, so the count is silently too high whenever any candidate was rejected, and separately, the SQL write path uses an insert-or-ignore for this one metric instead of the insert-or-replace every other metric uses, so a value from an earlier run against a reused database can survive a later run with a smaller artifact population. A further requirement carries no single-line defect at all: recovery must generalize to a fork whose longer-looking branch is itself valid for several steps before hitting a second, nested fork that decides which branch actually reaches furthest. Every fork in the prior round's fixtures was a flat two-branch comparison resolvable by simulating each branch to its own end and comparing lengths; a fixed-depth greedy heuristic that does exactly that, rather than a true recursive search over every admissible candidate at every position, passes all of them. A dedicated fixture generator constructs the nested case and was checked computationally against that exact heuristic: it is fooled on every one of ten generated seeds, while the same heuristic still passes every other test in the suite, including every prior fork, tie-break, and decoy family. The correct implementation already handles this case, since its search is genuinely recursive rather than depth-limited; only the fixture proving that generality is new. Self-describing fixture filenames from the prior round (decoy, genuine, tiebreak, tail-unreachable) are renamed to carry no information in either the bundled sample or the hidden datasets, and one dataset deliberately gives the true, longer-reaching branch a decoy-sounding name and the dead branch a genuine-sounding one, so a tie-break implemented as a check against filename vocabulary rather than plain string comparison fails immediately. Ten independently constructed hidden datasets, two new since the prior round, exercise these defects under different gap, fork, and duplicate patterns, and a perturbation layer mutates single fields, injects compound faults, and re-derives the exact expected truncation point at grading time rather than asserting a fixed number. Full credit requires diagnosing and fixing all twelve clusters together, satisfying the nested-fork generalization requirement, keeping distinct_artifacts and every other summary field consistent with the database across reruns against a reused database with a changing artifact population, and generalizing to data never seen during authoring rather than pattern-matching whatever is discoverable from the roughly sixty rows of bundled sample data alone."
solution_explanation = "The reference fix lives in solution/src/ledger, mirroring the package structure shipped in /app/src/ledger, alongside a shared environment/app/src/main.py that now threads a distinct_artifacts count through both the SQLite summary table and the JSON payload; main.py sits outside solve.sh's copy set because it already calls the ledger package correctly whether that package is broken or fixed. hashing.py is unchanged. statemachine.py corrects the two wrong transition targets, adds the missing EVICTED-to-REFRESH entry, adds REFRESH to the payload-bound op set, and adds validate_payload, which checks both content hash and size against the artifact's most recent STORE. fragments.py continues past malformed or duplicate-header rows instead of aborting the file. chainbuilder.py performs a backtracking depth-first search over every admissible candidate at each position, exploring branches in (fragment_name, row_index) order, undoing each candidate's state and last-store bookkeeping on backtrack, and keeping the longest-reaching path seen; this search already resolves the nested-fork requirement correctly because it recurses fully rather than simulating branches independently, and each candidate's admission now also recomputes hashing.compute_chain_hash and rejects any row whose chain_hash doesn't match, while a timestamp is rejected only when it is strictly less than the previous one so an equal timestamp is accepted. storage.py clears the ledger, artifact_state, and summary tables before every write with one unconditional delete per table, writes prev_hash and chain_hash into their correct columns, and uses a single generic insert of every summary_counts entry, so distinct_artifacts is cleared and rewritten by the same mechanism as every other metric with no special-casing. summary.py builds its op-count dictionary from the full fixed set of five operations, including REFRESH, so an absent operation still reports zero, folds artifact state by sequence number instead of fragment filename with an unconditional last-seq update on every op, and sources compute_distinct_artifacts from the recovered list rather than the raw candidate list. Applying the corrected package and re-running main.py's run() entrypoint reconstructs the ledger and materializes /app/output/ledger.db and /app/output/summary.json exactly as instructed."
verification_explanation = "tests/test_outputs.py holds 494 cases and is entirely outcome-based: every case writes real CSV fragment files to a directory, invokes the agent's own documented main.py run() entrypoint through agent_bridge's privilege-dropped subprocess, and grades solely by reading back the resulting SQLite database and summary.json; agent_runner.py's dispatch table exposes only run_main and run_main_isolated, so a correct solution that restructures the six modules' internals is graded purely on the artifacts it produces. Every case that recovers a chain also asserts distinct_artifacts against an independently computed expected value, so that field is checked far beyond its own dedicated family. Dedicated families construct single, cascading, tie-break, and nested forks where a locally-valid candidate is a dead end and a different locally-valid candidate reaches substantially further, including one family whose winning branch is decided by a second fork buried inside the first branch's own continuation, checked computationally against a shallow branch-simulate-and-compare heuristic that it alone catches among the entire suite. A payload-binding family constructs re-STORE cycles, content-only and size-only mismatches, and interleaved multi-artifact bindings, extended with dedicated REFRESH transition, payload-mismatch, and interleaved multi-step cases and a separate last-seq family. A timestamp family constructs equal-timestamp continuations that must be accepted alongside regressions buried behind otherwise-valid decoy subtrees. A storage-rerun family invokes run_main_isolated twice against the same database path, once with a shrinking dataset and once with a changing artifact population, and asserts no row, artifact, or summary metric from the first run survives incorrectly, including distinct_artifacts specifically. A summary family constructs fixtures missing one or more of the five operation types and asserts the JSON still reports an explicit zero, and a dedicated family constructs rejected fork and decoy candidates bearing artifact ids that are never actually recovered, asserting distinct_artifacts counts only the recovered population. A combinatorial decoy-subset matrix, a lexicographic tie-break family with digit-length, case, and punctuation variants, a misleading-filename family where the true branch carries a decoy-sounding name and the dead branch a genuine-sounding one, and a concurrent-fork family covering two different artifacts forking back to back round out the fork-adjacent coverage. The remaining tests cover the six more legible defects with comparable rigor: malformed-CSV and bad-header families; storage schema, round-trip, and edge-size checks; genesis-anchoring checks; and dense per-case bundled and hidden-dataset checks. Ten independently constructed hidden datasets, two new in this pass, one with a long EVICTED-REFRESH-REFRESH-REFRESH tail across two interleaved artifacts and one built from the same nested-fork generator used in the dedicated family, are exercised directly and through a perturbation family that mutates single fields, removes rows, and injects harmless duplicates, re-deriving the exact expected truncation point at grading time via an independently implemented reference search in conftest.py. Every fixture filename across the bundled sample and all ten hidden datasets is a neutral seg_NN.csv or fragment_X.csv form carrying no hint of its role. A metamorphic family confirms shuffled input, arbitrary file-splitting, and structural renaming never change the recovered chain except where a rename is specifically constructed to flip a tie-break. Every call into the agent's package runs inside a dedicated unprivileged subprocess dropped via setpriv, never inside the pytest process itself, and /logs/verifier is locked to mode 700 before that subprocess ever starts. artifacts = [\"/app/\"] is declared as a top-level key so the separate verifier container can exercise the agent's live code directly rather than only inspecting a pre-existing database file."

